<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Página no encontrada — Pulso RD</title>
<link rel="icon" type="image/svg+xml" href="favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#EAE7DC; --ink:#16233D; --ink-soft:#44506A; --gold:#B9872A; --line:rgba(22,35,61,0.18);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){ --paper:#141A24; --ink:#ECE7DA; --ink-soft:#AEB6C6; --gold:#D9A94A; --line:rgba(236,231,218,0.18); color-scheme: dark; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%; margin:0;}
  body{
    background:var(--paper); color:var(--ink); font-family:'Inter',sans-serif;
    display:flex; align-items:center; justify-content:center; text-align:center; padding:24px;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  h1{font-family:'Source Serif 4',serif; font-size:clamp(2rem,6vw,3.2rem); margin:0 0 10px;}
  h1 em{font-style:normal; color:var(--gold);}
  p{color:var(--ink-soft); font-size:1rem; margin:0 0 28px; max-width:36ch; margin-left:auto; margin-right:auto;}
  a{
    display:inline-block; border:1px solid var(--line); color:var(--ink); text-decoration:none;
    padding:10px 20px; border-radius:2px; font-size:0.9rem; font-weight:600;
  }
  a:hover{border-color:var(--gold);}
</style>
</head>
<body>
  <div>
    <h1>Pulso<em>RD</em></h1>
    <p>Esta página no existe o se movió. Los datos de divisas, combustibles, peajes, INTRANT y transporte siguen en el inicio.</p>
    <a href="./">← Volver al inicio</a>
  </div>
</body>
</html>
