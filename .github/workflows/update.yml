name: Actualizar datos Pulso RD

on:
  schedule:
    # Todos los días 9:00 AM y 3:00 PM hora RD (13:00 y 19:00 UTC)
    - cron: "0 13,19 * * *"
    # Viernes 6:30 PM hora RD (22:30 UTC) para capturar precios semanales de combustibles MICM
    - cron: "30 22 * * 5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ejecutar actualizador de datos
        run: python scripts/update_data.py

      - name: Guardar cambios en data.js
        run: |
          git config user.name "PulsoRD Bot"
          git config user.email "bot@users.noreply.github.com"
          git add data.js
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: actualizar tasas y combustibles" && git push)
